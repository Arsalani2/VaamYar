name: Unit Tests (no release)

# فقط تست اجرا می‌کند؛ هیچ نسخه‌ای bump یا منتشر نمی‌شود. جزئیات شکست به‌صورت کامنت روی issue #3 می‌آید.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'ci/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle Wrapper
        run: |
          test -f gradlew && test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradlew / gradle-wrapper.jar missing"; exit 1; }
          chmod +x gradlew
          ./gradlew --version

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --continue 2>&1 | tee gradle-test.log

      - name: Summarize Test Failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "::error::مرحلهٔ تست شکست خورد — جزئیات در کامنت issue #3"
          REPORT=ci-report.md
          {
            echo "## شکست تست CI — run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) روی کامیت ${GITHUB_SHA:0:7}"
            echo ""
            echo "حجم لاگ gradle: $(wc -l < gradle-test.log 2>/dev/null || echo missing) خط"
            echo ""
            echo "### خطاهای کامپایل/خلاصه‌ی Gradle:"
            echo '```'
            grep -n -E "^e: |What went wrong|Execution failed|Caused by|FAILURE:|FAILED$| tests completed|OutOfMemory|disappeared|Daemon" gradle-test.log 2>&1 | head -60
            echo '```'
            echo ""
            echo "### انتهای لاگ Gradle (tail 250):"
            echo '```'
            tail -n 250 gradle-test.log 2>&1
            echo '```'
          } > "$REPORT"
          python3 - <<'PY' > junit-failures.txt
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      el = tc.find(kind)
                      if el is not None and n < 30:
                          n += 1
                          msg = (el.get('message') or '').replace(chr(10), ' ')[:600]
                          print('- `' + (tc.get('classname') or '?') + '.' + (tc.get('name') or '?') + '` -> ' + msg)
          PY
          if [ -s junit-failures.txt ]; then
            echo "" >> "$REPORT"
            echo "### تست‌های شکست‌خورده (JUnit):" >> "$REPORT"
            cat junit-failures.txt >> "$REPORT"
          fi
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT" || echo "::warning::کامنت روی issue نشست"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            gradle-test.log
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14